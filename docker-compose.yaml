#version: "3.9"

services:
  db: 
    image: postgres:13
    container_name: ecommerce1
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: database_ecommerce
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./queries:/queries
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d database_ecommerce"]
      interval: 5s  
      retries: 10
      start_period: 10s
  etl:
    build: ./etl
    depends_on:
       db: 
         condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: ecommerce
      DB_PASSWORD: securepassword
      DB_NAME: database_ecommerce
      
    volumes:
      - ./etl:/app
      - ./data:/app/data
      

volumes:
  db_data: